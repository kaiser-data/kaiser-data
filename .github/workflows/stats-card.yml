name: Stats Grade Card

on:
  schedule:
    # Daily at 05:30 UTC
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate stats card
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/generate-stats-card.mjs --user "${GH_USER}" --out assets/stats-card.svg
      - name: Commit refreshed card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-card.svg
          git diff --staged --quiet || git commit -m "chore: refresh stats grade card [skip ci]"
          git push
